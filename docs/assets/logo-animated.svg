<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="varia-title">
  <title id="varia-title">Varia</title>
  <style>
    .varia-dot { animation: varia-drift 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .varia-mark { animation: varia-sway 3.6s ease-in-out infinite; transform-box: view-box; transform-origin: 30px 47px; }
    @keyframes varia-drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-4px, 5px); } }
    @keyframes varia-sway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
    @media (prefers-reduced-motion: reduce) { .varia-dot, .varia-mark { animation: none; transform: none; } }
  </style>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#4B32D6"/>
  <path class="varia-mark" d="M15 19 L30 47 L45 19" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="varia-dot" cx="49" cy="15" r="5.5" fill="#FFC857"/>
</svg>
